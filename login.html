<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookBuddy-Sign In</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dark-mode auth-body">
    <div class="auth-wrapper">
      <div class="auth-card card bg-dark text-light">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex align-items-center justify-content-center mb-4">
            <i class="bi bi-book me-2 fs-2 text-primary"></i>
            <h3 class="text-light mb-0">BookBuddy</h3>
          </div>

          <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
            <li class="nav-item">
              <button
                class="nav-link active"
                id="tab-login-btn"
                onclick="switchTab('login')"
                type="button"
              >
                Login
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="tab-register-btn"
                onclick="switchTab('register')"
                type="button"
              >
                Register
              </button>
            </li>
          </ul>

          <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

          <!-- Login form -->
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input
                type="text"
                class="form-control bg-dark text-light"
                id="loginUsername"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control bg-dark text-light"
                id="loginPassword"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
          </form>

          <!-- Register form -->
          <form id="registerForm" class="d-none">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input
                type="text"
                class="form-control bg-dark text-light"
                id="registerUsername"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control bg-dark text-light"
                id="registerPassword"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label">Confirm Password</label>
              <input
                type="password"
                class="form-control bg-dark text-light"
                id="registerConfirm"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-person-plus me-1"></i> Create Account
            </button>
          </form>

          <p class="text-muted text-center small mt-4 mb-0">
            Your library is private to your account and stored on this device.
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
      // If already logged in, go straight to the app
      if (getCurrentUser()) {
        window.location.href = "index.html";
      }

      function switchTab(tab) {
        const isLogin = tab === "login";
        document.getElementById("loginForm").classList.toggle("d-none", !isLogin);
        document.getElementById("registerForm").classList.toggle("d-none", isLogin);
        document.getElementById("tab-login-btn").classList.toggle("active", isLogin);
        document.getElementById("tab-register-btn").classList.toggle("active", !isLogin);
        hideAlert();
      }

      function showAlert(message) {
        const alertBox = document.getElementById("authAlert");
        alertBox.textContent = message;
        alertBox.classList.remove("d-none");
      }

      function hideAlert() {
        document.getElementById("authAlert").classList.add("d-none");
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        try {
          await loginUser(username, password);
          window.location.href = "index.html";
        } catch (err) {
          showAlert(err.message);
        }
      });

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById("registerUsername").value;
        const password = document.getElementById("registerPassword").value;
        const confirm = document.getElementById("registerConfirm").value;
        if (password !== confirm) {
          showAlert("Passwords do not match.");
          return;
        }
        try {
          await registerUser(username, password);
          window.location.href = "index.html";
        } catch (err) {
          showAlert(err.message);
        }
      });
    </script>
  </body>
</html>
